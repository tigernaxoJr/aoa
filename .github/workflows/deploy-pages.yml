# Builds the static site (Guide API under /api, later the Web UI) and deploys it to GitHub Pages.
# The site URL comes from GitHub Pages itself (configure-pages → base_url), so the base path always
# follows the repository name (e.g. https://<owner>.github.io/index-url-director) or a custom domain.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # Build only needs the schemas and zip tooling; skip large binary downloads.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check specs and skill links
        run: npm run test:specs

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
