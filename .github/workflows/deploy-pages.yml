# Builds the site (Web UI at the root, Guide API under /api) and publishes it to the gh-pages branch.
# The site URL follows the repository name: https://<owner>.github.io/<repo> (index-url-director),
# derived from GITHUB_REPOSITORY by tools/build-api.mjs and apps/web/vite.config.ts. Set the repository
# variable SITE_URL to override it (e.g. for a custom domain).
# One-time setup: Settings → Pages → Build and deployment → Source: Deploy from a branch → gh-pages / (root).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The build needs no browsers; skip large binary downloads.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check specs, skill links and generated types
        run: |
          npm run test:specs
          node tools/gen-types.mjs --check
          npm run typecheck

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
