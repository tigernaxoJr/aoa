# Builds the site (Portal at the root, each app under /<slug>/, Guide API under /api) and publishes it to
# the gh-pages branch.
# The site URL is the repository variable SITE_URL, defaulting to the custom domain below; without either it
# would follow the repository name (https://<owner>.github.io/<repo>, see apps/vite.shared.ts). For a custom
# domain the Portal build writes dist/CNAME, so force_orphan never drops the domain.
# One-time setup: Settings → Pages → Build and deployment → Source: Deploy from a branch → gh-pages / (root).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # The build needs no browsers; skip large binary downloads.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check specs, skill links and generated types
        run: |
          pnpm run test:specs
          node apps/video/tools/gen-types.mjs --check
          node apps/slide/tools/gen-types.mjs --check
          pnpm run typecheck

      - name: Build site
        run: |
          export SITE_URL="${SITE_URL:-https://aoa.tigernaxo.com}"
          pnpm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
