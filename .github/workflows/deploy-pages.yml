# Builds the site (Portal at the root, each app under /<slug>/, Guide API under /api) and publishes it to
# the gh-pages branch.
# The site URL follows the repository name: https://<owner>.github.io/<repo> (index-url-director),
# derived from GITHUB_REPOSITORY by apps/video/tools/build-api.mjs and apps/vite.shared.ts. Set the repository
# variable SITE_URL to override it, e.g. https://agent-offload.example.com for a custom domain; its host is
# then written to gh-pages as CNAME on every deploy (force_orphan would otherwise drop the domain).
# One-time setup: Settings → Pages → Build and deployment → Source: Deploy from a branch → gh-pages / (root).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # The build needs no browsers; skip large binary downloads.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check specs, skill links and generated types
        run: |
          pnpm run test:specs
          node apps/video/tools/gen-types.mjs --check
          pnpm run typecheck

      - name: Build site
        run: pnpm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Custom domain
        id: domain
        run: |
          host=$(node -e "const u = process.env.SITE_URL; if (u) { const h = new URL(u).hostname; if (!h.endsWith('.github.io')) console.log(h) }")
          echo "cname=$host" >> "$GITHUB_OUTPUT"
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          cname: ${{ steps.domain.outputs.cname }}
          commit_message: 'deploy: ${{ github.sha }}'
