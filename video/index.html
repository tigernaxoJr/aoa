<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>影片工作台已分成兩個 · Agent Video Producer</title>
    <link rel="icon" href="../favicon.ico" />
    <meta name="description" content="Video Studio 已分成故事動畫工作台與產品介紹影片工作台。" />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --card: #ffffff;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #d6d3d1;
        --accent: #0369a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --card: #1c1917;
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #44403c;
          --accent: #38bdf8;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.6 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 56px 16px;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      p {
        color: var(--muted);
      }
      .cards {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }
      @media (min-width: 640px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
      }
      .cards a {
        display: block;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      .cards a:hover,
      .cards a:focus-visible {
        border-color: var(--accent);
      }
      .cards strong {
        display: block;
        font-size: 1.1rem;
      }
      .cards span {
        display: block;
        margin-top: 6px;
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>影片工作台已分成兩個</h1>
      <p>Video Studio 已拆成兩個獨立的工作台。請選擇你的影片類型；已經做到一半的專案，到對應的工作台選它的資料夾就能繼續。</p>
      <div class="cards">
        <a href="../story/" data-testid="go-story"><strong>🎭 故事動畫工作台</strong><span>把故事或點子做成動畫：角色、聲音與 SVG 動畫。</span></a>
        <a href="../product/" data-testid="go-product"><strong>🎬 產品介紹影片工作台</strong><span>把產品網址或原始碼做成有旁白的產品介紹影片。</span></a>
      </div>
      <p><a href="../" style="color: var(--accent)">← 回到平台總覽</a></p>
    </main>
  </body>
</html>
